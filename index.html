<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="首爾旅遊" />
  <title>首爾旅遊 2026</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <section id="loginView" class="login-screen">
      <div class="login-card">
        <div class="flag">🇰🇷</div>
        <h1>首爾旅遊 2026</h1>
        <p>私人旅遊行程 App</p>
        <button id="loginBtn" class="primary-btn">使用 Google 登入</button>
        <div id="loginStatus" class="muted small"></div>
      </div>
    </section>

    <section id="mainView" class="hidden">
      <header class="topbar">
        <div>
          <div class="eyebrow">🇰🇷 SEOUL · 2026</div>
          <h1 id="pageTitle">今日</h1>
        </div>
        <button id="profileBtn" class="icon-btn" aria-label="帳戶">👤</button>
      </header>

      <main id="content" class="content"></main>

      <nav class="bottom-nav" aria-label="主要選單">
        <button data-page="today" class="nav-item active"><span>🏠</span><small>今日</small></button>
        <button data-page="days" class="nav-item"><span>📅</span><small>行程</small></button>
        <button data-page="bookings" class="nav-item"><span>🎫</span><small>預訂</small></button>
        <button data-page="money" class="nav-item"><span>💱</span><small>匯率</small></button>
        <button data-page="more" class="nav-item"><span>☰</span><small>更多</small></button>
      </nav>
    </section>

    <dialog id="profileDialog" class="modal">
      <div class="modal-head"><strong>帳戶</strong><button id="closeProfile" class="icon-btn">✕</button></div>
      <div id="profileInfo"></div>
      <button id="logoutBtn" class="secondary-btn full">登出</button>
    </dialog>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
