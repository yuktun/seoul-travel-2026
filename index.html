<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f6f8" id="themeColorMeta" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="首爾旅遊" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <title>首爾旅遊 2026</title>
  <link rel="manifest" href="manifest.webmanifest?v=1.19" />
  <script>
    (() => {
      const pref = localStorage.getItem('themePreference') || 'auto';
      const dark = pref === 'night' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.themePreference = pref;
      document.documentElement.dataset.theme = dark ? 'night' : 'day';
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=1.19" />
</head>
<body>
  <div id="app">
    <section id="loginView" class="login-screen">
      <div class="login-card">
        <div class="flag">🇰🇷</div>
        <h1>首爾旅遊 2026</h1>
        <p>私人旅遊行程 App</p>
        <button id="loginBtn" class="primary-btn">使用 Google 登入</button>
        <div id="loginStatus" class="muted small"></div>
      </div>
    </section>

    <section id="accessView" class="login-screen hidden">
      <div class="login-card">
        <div class="flag" id="accessIcon">⏳</div>
        <h1 id="accessTitle">正在檢查權限</h1>
        <p id="accessMessage">請稍候…</p>
        <button id="retryAccessBtn" class="primary-btn hidden">重新檢查</button>
        <button id="accessLogoutBtn" class="secondary-btn full access-logout">使用其他帳戶</button>
      </div>
    </section>

    <section id="mainView" class="hidden">
      <header class="topbar">
        <div>
          <div class="eyebrow">🇰🇷 SEOUL · 2026</div>
          <h1 id="pageTitle">今日</h1>
        </div>
        <div class="top-actions"><button id="languageBtn" class="language-btn" aria-label="切換顯示語言">한국어</button><button id="profileBtn" class="icon-btn" aria-label="開啟帳戶資料">👤</button></div>
      </header>

      <main id="content" class="content"></main>

      <nav class="bottom-nav" aria-label="主要選單">
        <button data-page="today" class="nav-item active"><span>🏠</span><small>今日</small></button>
        <button data-page="days" class="nav-item"><span>📅</span><small>行程</small></button>
        <button data-page="bookings" class="nav-item"><span>🎫</span><small>預訂</small></button>
        <button data-page="money" class="nav-item"><span>💱</span><small>匯率</small></button>
        <button data-page="more" class="nav-item"><span>☰</span><small>更多</small></button>
      </nav>
    </section>

    <dialog id="profileDialog" class="modal">
      <div class="modal-head"><strong>帳戶</strong><button id="closeProfile" class="icon-btn" aria-label="關閉帳戶資料">✕</button></div>
      <div id="profileInfo"></div>
      <button id="logoutBtn" class="secondary-btn full">登出</button>
    </dialog>

    <dialog id="installDialog" class="modal">
      <div class="modal-head"><strong>加入主畫面</strong><button id="closeInstall" class="icon-btn" aria-label="關閉安裝說明">✕</button></div>
      <div id="installInstructions"></div>
      <button id="confirmInstallHelp" class="primary-btn full">知道了</button>
    </dialog>

    <dialog id="itemEditorDialog" class="modal editor-modal">
      <form id="editorForm">
        <div class="modal-head"><strong id="editorTitle">編輯</strong><button id="closeEditor" type="button" class="icon-btn" aria-label="關閉編輯視窗">✕</button></div>
        <div id="eventEditorFields" class="form-stack">
          <label>時間<input id="eventTime" class="form-input" placeholder="例如：10:30–12:30"></label>
          <label>行程名稱<input id="eventTitle" class="form-input" placeholder="輸入地點或活動名稱"></label>
          <label>描述<textarea id="eventNote" class="form-input" rows="4" placeholder="交通、地址或補充資料"></textarea></label>
          <label>標籤<input id="eventTags" class="form-input" placeholder="例如：必去、可略過"></label>
        </div>
        <div id="bookingEditorFields" class="form-stack hidden">
          <label>預訂類別<input id="bookingType" class="form-input" placeholder="例如：航班、酒店、接送"></label>
          <label>預訂名稱<input id="bookingTitle" class="form-input" placeholder="輸入預訂名稱"></label>
          <div><div class="editor-field-head"><strong>詳細資料</strong><button id="addBookingDetail" type="button" class="secondary-btn small">＋ 新增一行</button></div><div id="bookingDetails" class="booking-details-editor"></div></div>
        </div>
        <div id="editorStatus" class="editor-status" role="alert"></div>
        <div class="editor-actions"><button id="cancelEditor" type="button" class="secondary-btn">取消</button><button id="saveEditor" type="submit" class="primary-btn">儲存</button></div>
      </form>
    </dialog>

    <section id="detailDialog" class="detail-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="detailTitle" aria-hidden="true">
      <div class="detail-sheet">
        <div class="modal-head"><strong id="detailTitle"></strong><button id="closeDetail" class="icon-btn" aria-label="關閉資料視窗">✕</button></div>
        <div id="koreanHelper" class="korean-helper hidden"><strong>기사님, 이곳으로 가 주세요.</strong><span>司機先生／小姐，請帶我到這裡。</span><strong>이곳을 찾는 것을 도와주세요.</strong><span>請幫我找這個地方。</span></div>
        <div id="detailIntro" class="detail-intro"></div>
        <iframe id="detailMap" class="detail-map" title="Google 地圖" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <div class="detail-actions"><a id="openGoogleMaps" class="primary-btn map-open-btn" target="_blank" rel="noopener">在 Google 地圖開啟</a><button id="closeDetailBottom" class="secondary-btn">關閉</button></div>
      </div>
    </section>
  </div>

  <script type="module" src="app.js?v=1.19"></script>
</body>
</html>
